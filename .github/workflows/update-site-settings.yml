name: Update WordPress Site Settings

on:
  workflow_dispatch:   # 手動実行のみ（一度使ったら削除してOK）

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update site title and tagline
        env:
          WORDPRESS_URL:      ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_PASSWORD: ${{ secrets.WORDPRESS_PASSWORD }}
        run: |
          AUTH=$(echo -n "${WORDPRESS_USERNAME}:${WORDPRESS_PASSWORD}" | base64)

          RESPONSE=$(curl -sf -X POST \
            "${WORDPRESS_URL}/wp-json/wp/v2/settings" \
            -H "Authorization: Basic ${AUTH}" \
            -H "Content-Type: application/json" \
            -d '{
              "title":       "楽天ガジェットNAVI",
              "description": "毎日更新！楽天市場のガジェットベストバイ"
            }')

          echo "レスポンス: $RESPONSE"

          TITLE=$(echo "$RESPONSE" | jq -r '.title')
          DESC=$(echo "$RESPONSE" | jq -r '.description')

          echo "✅ サイトタイトル: $TITLE"
          echo "✅ キャッチフレーズ: $DESC"
